<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F4F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141917" media="(prefers-color-scheme: dark)">
<title>Planner Nikah</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='12' cy='17' r='8' fill='none' stroke='%233D675C' stroke-width='3'/%3E%3Ccircle cx='20' cy='17' r='8' fill='none' stroke='%2394656F' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: satu kolom tenang, kartu tipis bergaris, navigasi bawah seperti aplikasi HP */
:root{
  --bg:#F2F4F1; --surface:#FFFFFF; --surface-2:#E8ECE7; --ink:#1F2A27; --muted:#64706B; --line:#D8DED7;
  --accent:#3D675C; --accent-ink:#FFFFFF; --accent-soft:#DDE8E2;
  --pA:#4F6B86; --pA-soft:#E1E8EF; --pB:#94656F; --pB-soft:#F0E4E6;
  --ok:#47785A; --ok-soft:#DFEBE2; --warn:#9A6F28; --warn-soft:#F2E9D7; --danger:#A04E46;
  --scrim:rgba(20,28,25,.38); --shadow:0 10px 30px rgba(20,28,25,.12);
  --g1:#3D675C; --g2:#4F6B86; --g3:#94656F; --g4:#B08A3E; --g5:#6E8F7E; --g6:#7A6A93; --g7:#A0705A; --g8:#5F7D86; --g9:#8C8F6A;
  --f-display:"Newsreader",Georgia,"Times New Roman",serif;
  --f-body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141917; --surface:#1B2220; --surface-2:#252E2B; --ink:#E4EAE6; --muted:#98A49F; --line:#2F3935;
  --accent:#8CB6A8; --accent-ink:#0F1D19; --accent-soft:#223430;
  --pA:#94AECA; --pA-soft:#243140; --pB:#CC9CA6; --pB-soft:#3A2A2E;
  --ok:#86B596; --ok-soft:#21342A; --warn:#D3A862; --warn-soft:#3A3020; --danger:#D98B82;
  --scrim:rgba(0,0,0,.55); --shadow:0 10px 30px rgba(0,0,0,.4); color-scheme:dark;
  --g1:#8CB6A8; --g2:#94AECA; --g3:#CC9CA6; --g4:#D3B06E; --g5:#A9C7B5; --g6:#B3A3CF; --g7:#D29C84; --g8:#8FB2BC; --g9:#BDBF95}}
/* Riwayat pemasukan / pengeluaran */
.riw-hit{cursor:pointer;border-radius:10px;margin:-6px;padding:6px;position:relative}
.riw-hit:hover{background:var(--surface-2)}
.riw-more{position:absolute;top:6px;right:6px;font-size:12px;font-weight:600;color:var(--accent);display:inline-flex;align-items:center;gap:2px}
.donut{display:block;margin:6px auto 4px;width:220px;max-width:100%;height:auto}
.donut text{fill:var(--ink);font-family:var(--f-body)}
.riw-row{display:flex;align-items:center;gap:12px;cursor:pointer}
.riw-row:hover{background:var(--surface-2)}
.riw-sw{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;color:var(--surface);font-weight:700;font-size:13px}
.riw-tx{padding:10px 16px 10px 62px!important;background:var(--bg);cursor:pointer}
.riw-tx:hover{background:var(--surface-2)}
.datebox{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}

*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.6;cursor:default}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 104px}

.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-block:20px 8px}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.couple{font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1.15;margin:2px 0 0;text-wrap:balance}
.couple i{color:var(--muted);font-style:italic;padding-inline:2px}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:40px;height:40px;display:grid;place-items:center;flex:none;position:relative}
.iconbtn svg{width:19px;height:19px}
.iconbtn .badge{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--pB);border:2px solid var(--surface)}

h2.sec{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0;text-wrap:balance}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:26px 0 10px}
.sub{color:var(--muted);font-size:13px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.list > *{padding:13px 16px}
.list > * + *{border-top:1px solid var(--line)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.danger{color:var(--danger)}
.btn.block{width:100%;justify-content:center;padding:12px}
.btn svg{width:15px;height:15px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:5px}
.linkbtn svg{width:14px;height:14px;flex:none}

.bar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar > span{display:block;height:100%;background:var(--accent);border-radius:99px}
.split{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--surface-2);gap:2px}
.split > span{display:block;height:100%}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.A{background:var(--pA-soft);color:var(--pA)} .pill.B{background:var(--pB-soft);color:var(--pB)} .pill.AB,.pill.C{background:var(--accent-soft);color:var(--accent)}
.st-nego{background:var(--warn-soft);color:var(--warn)} .st-deal{background:var(--accent-soft);color:var(--accent)} .st-lunas{background:var(--ok-soft);color:var(--ok)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
button.pill{border:0}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.banner{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 14px;font-size:13px;margin-top:8px}
.banner.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.banner.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.banner.err{background:var(--surface);border-color:var(--danger);color:var(--danger)}

/* Beranda */
.count{display:flex;align-items:flex-end;gap:14px;margin-top:14px}
.count b{font-family:var(--f-display);font-weight:400;font-size:64px;line-height:.9;letter-spacing:-.02em}
.count small{display:block;color:var(--muted);font-size:13px}
.count strong{display:block;font-size:15px;font-weight:600}
.kpi{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:baseline}
.kpi .bar{grid-column:1/-1}
.kpi .v{font-weight:600}
.feed{display:flex;gap:10px;align-items:flex-start}
.av{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--muted)}
.av.A{background:var(--pA-soft);color:var(--pA)} .av.B{background:var(--pB-soft);color:var(--pB)}

/* Uang */
.big{font-family:var(--f-display);font-size:34px;line-height:1.1;font-weight:400}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.cols3 > div{min-width:0}
.lbl{font-size:12px;color:var(--muted)}
.val{font-weight:600}
.kant{cursor:pointer}
.kant:hover{background:var(--surface-2)}
.amt{font-weight:600;white-space:nowrap}
.amt.in{color:var(--ok)} .amt.out{color:var(--danger)}

/* Vendor */
.vcat{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:18px 2px 8px}
.vcard .name{font-weight:600;font-size:16px;background:none;border:0;padding:0;text-align:left}
.vmeta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}
.vnote{font-size:13px;color:var(--muted);margin-top:6px;white-space:pre-wrap;overflow-wrap:anywhere}

/* Checklist */
.chk{display:flex;gap:12px;align-items:flex-start}
.chk input{appearance:none;-webkit-appearance:none;width:22px;height:22px;border:1.5px solid var(--line);border-radius:6px;flex:none;margin:1px 0 0;display:grid;place-items:center;background:var(--surface);cursor:pointer}
.chk input:checked{background:var(--accent);border-color:var(--accent)}
.chk input:checked::after{content:"";width:10px;height:6px;border-left:2px solid var(--accent-ink);border-bottom:2px solid var(--accent-ink);transform:translateY(-1px) rotate(-45deg)}
.chk .t{font-weight:500}
.chk.done .t{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.chk .k{font-size:13px;color:var(--muted);margin-top:2px}
.ghead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:22px 2px 8px}
.ghead h3{margin:0;font-size:15px;font-weight:600}
.flags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

/* Tamu */
.trow{display:flex;align-items:center;gap:10px}
.tname{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column}
.tname b{font-weight:600;overflow-wrap:anywhere}
.iconbtn.sm{width:34px;height:34px;border-radius:9px;color:var(--ok)}
.iconbtn.sm svg{width:17px;height:17px}
.rs-hadir{background:var(--ok-soft);color:var(--ok)} .rs-tidak{color:var(--danger)}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;margin:12px 0 10px}
.guide h4{margin:18px 0 6px;font-size:15px}
.guide ol{margin:0;padding-left:20px;line-height:1.7;font-size:14px}
.guide p{font-size:14px;margin:6px 0 0}

/* Pasangan */
.code{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:30px;letter-spacing:.2em;font-weight:600;text-align:center;padding:16px 8px;border:1px dashed var(--line);border-radius:12px;background:var(--bg);user-select:all;overflow-wrap:anywhere}
.linkbox{font-size:13px;color:var(--muted);overflow-wrap:anywhere;user-select:all;background:var(--surface-2);border-radius:8px;padding:8px 10px}
.person{display:flex;align-items:center;gap:12px}
.person .av{width:36px;height:36px;font-size:15px}

/* Navigasi */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 9px;font-size:10.5px;font-weight:600;color:var(--muted);min-width:0}
.tabs button svg{width:21px;height:21px}
.tabs button[aria-current="page"]{color:var(--accent)}
@media (min-width:760px){
  .tabs{left:50%;right:auto;transform:translateX(-50%);bottom:18px;width:600px;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding-bottom:0}
}

/* Sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:18px 18px 0 0;max-height:90%;overflow:auto;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow)}
@media (min-width:760px){.sheet{left:50%;bottom:auto;top:50%;transform:translate(-50%,-50%);width:520px;border-radius:16px;max-height:86%}}
.sheet h3{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0}
form.f{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld > span{font-size:13px;font-weight:600}
.fld em{font-style:normal;font-size:12px;color:var(--muted);font-weight:400}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:10px 12px;min-width:0}
.moneywrap{position:relative;display:block}
.fld > .moneywrap{font-size:inherit;font-weight:inherit}
.moneywrap > span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:600;pointer-events:none}
.fld .moneywrap input{padding-left:40px;font-variant-numeric:tabular-nums;font-weight:600}
.fld textarea{min-height:70px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:10px;padding:3px;gap:3px}
.seg label{position:relative;text-align:center;padding:8px 6px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.seg input{position:absolute;opacity:0;inset:0;cursor:pointer}
.seg label:has(input:checked){background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg label:has(input:focus-visible){outline:2px solid var(--accent)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px)}
.empty{text-align:center;padding:28px 18px;color:var(--muted)}
.empty p{margin:0 0 14px}
.muted{color:var(--muted)}
.small{font-size:13px}
.note{font-size:12.5px;color:var(--muted);margin-top:18px;line-height:1.6}

/* Layar masuk & mulai */
.gate{max-width:420px;margin:0 auto;padding-block:9vh 40px}
.gate h1{font-family:var(--f-display);font-weight:400;font-size:34px;line-height:1.1;margin:6px 0 8px;text-wrap:balance}
.gate .lead{color:var(--muted);margin:0 0 20px}
.gate .card + .card{margin-top:14px}
.authtabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line);margin:-4px -16px 4px}
.authtabs button{border:0;background:none;padding:10px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.authtabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.pwwrap{position:relative}
.pwwrap input{padding-right:64px}
.pwwrap button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);font-size:12px;font-weight:600;padding:6px}
.foot{display:flex;justify-content:center;gap:6px;margin-top:18px;font-size:13px;color:var(--muted);flex-wrap:wrap}

@media (max-width:420px){.cols3{grid-template-columns:1fr 1fr}.cols3 > div:last-child{grid-column:1/-1}.vmeta{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app" id="app"><div class="empty" style="margin-top:30vh">Memuat planner…</div></div>
<nav class="tabs" id="tabs" hidden></nav>
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="row between"><h3 id="sheetTitle"></h3><button class="iconbtn" id="sheetClose" aria-label="Tutup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div id="sheetBody"></div>
</div>
<div class="toast" id="toast" hidden role="status"></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.100.0/dist/umd/supabase.js"></script>
<script>
/* ---------- Data referensi ---------- */
const KATEGORI=['Venue','Catering','Dekorasi','MUA & Busana','Foto & Video','Hiburan & MC','Undangan','Souvenir','WO / WP','Mahar & Seserahan','Cincin','Transportasi','Lainnya'];
const STATUS=[['incaran','Incaran'],['nego','Nego'],['deal','Deal'],['lunas','Lunas']];
const KANTONG_STD=['KUA & Berkas','Venue','Catering','Dekorasi','MUA & Busana','Foto & Video','Mahar & Seserahan','Cincin','Undangan & Souvenir','Hiburan & MC','Dana Darurat'];
const FASE=['12–9 bulan sebelum','9–6 bulan sebelum','6–3 bulan sebelum','3–1 bulan sebelum','Minggu terakhir','Setelah hari H','Lainnya'];
const TUGAS_STD={
 '12–9 bulan sebelum':['Sepakati total budget dan sumber dana','Tentukan tanggal dan konsep acara','Survei dan booking venue','Susun draf daftar tamu kedua keluarga','Buka tabungan bersama'],
 '9–6 bulan sebelum':['Putuskan pakai WO/WP atau tidak','Booking catering dan jadwalkan test food','Booking fotografer dan videografer','Booking MUA dan busana','Pilih vendor dekorasi'],
 '6–3 bulan sebelum':['Urus surat pengantar RT/RW dan kelurahan','Ikut bimbingan perkawinan (Bimwin) di KUA','Cek kesehatan dan imunisasi TT','Pesan undangan dan souvenir','Beli cincin','Siapkan mahar dan seserahan'],
 '3–1 bulan sebelum':['Daftar nikah di KUA atau lewat SIMKAH','Serahkan berkas ke KUA tujuan','Sebar undangan','Fitting busana','Konfirmasi wali dan dua saksi','Finalkan rundown acara'],
 'Minggu terakhir':['Technical meeting dengan semua vendor','Pelunasan vendor sesuai kontrak','Siapkan berkas asli untuk hari akad','Istirahat cukup'],
 'Setelah hari H':['Bayar sisa tagihan vendor','Ambil buku nikah','Perbarui KTP dan KK di Disdukcapil','Kirim ucapan terima kasih']
};
const SES_STD={
 mahar:['Mahar (uang tunai atau emas)'],
 seserahan:["Seperangkat alat salat (mukena, sajadah, Al-Qur'an)",'Pakaian atau kain','Tas','Sepatu atau sandal','Kosmetik dan skincare','Perlengkapan mandi','Pakaian dalam','Parfum','Perhiasan','Jam tangan','Kue atau makanan tradisional','Buah-buahan','Wadah dan hiasan hantaran']
};
const GRUP_STD=['Keluarga inti','Keluarga besar','Teman kantor','Teman kuliah','Teman sekolah','Tetangga','Rekan orang tua'];
const TPL_UNDANGAN='Halo {nama}, dengan penuh syukur kami {pria} & {wanita} mengundang kamu untuk hadir di hari pernikahan kami pada {tanggal}. Detail waktu dan lokasi kami kirim menyusul. Mohon kabari kehadirannya ya. Terima kasih.';
/* Berkas nikah: dirangkum dari Kemenag (Bimas Islam), PMA 30/2024 dan liputan media 2025–2026 */
const BERKAS_CATIN=[
 {id:'n1',t:'Surat pengantar nikah (N1) dari kelurahan/desa',k:'Bawa surat pengantar RT/RW. Kelurahan biasanya sekalian mengeluarkan N2 dan N4.'},
 {id:'n2',t:'Surat keterangan asal-usul (N2)'},
 {id:'n4',t:'Surat keterangan tentang orang tua (N4)'},
 {id:'ktp',t:'Fotokopi KTP-el'},
 {id:'kk',t:'Fotokopi Kartu Keluarga'},
 {id:'akta',t:'Fotokopi akta kelahiran'},
 {id:'ijazah',t:'Fotokopi ijazah terakhir',k:'Diminta di sebagian KUA.'},

const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp=n=>(n<0?'−':'')+'Rp'+Math.abs(Math.round(n||0)).toLocaleString('id-ID');
function parseRp(v){
  v=String(v||'').toLowerCase().replace(/\s/g,'').replace(/^rp/,'');
  let m=1;
  if(/(jt|juta)$/.test(v)){m=1e6;v=v.replace(/(jt|juta)$/,'')}
  else if(/(rb|ribu|k)$/.test(v)){m=1e3;v=v.replace(/(rb|ribu|k)$/,'')}
  if(m>1){const n=parseFloat(v.replace(',','.').replace(/[^\d.]/g,''));return isNaN(n)?0:Math.round(n*m)}
  return parseInt(v.replace(/\D/g,''),10)||0;
}
const fmtInput=n=>n?Number(n).toLocaleString('id-ID'):'';
function todayISO(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}
function fmtDate(iso,long){if(!iso)return '';const d=new Date(String(iso).length>10?iso:iso+'T00:00:00');return d.toLocaleDateString('id-ID',long?{weekday:'long',day:'numeric',month:'long',year:'numeric'}:{day:'numeric',month:'short',year:'numeric'})}
function daysUntil(iso){if(!iso)return null;const t=new Date();t.setHours(0,0,0,0);return Math.round((new Date(iso+'T00:00:00')-t)/864e5)}
const pct=(a,b)=>b>0?Math.max(0,Math.min(100,a/b*100)):0;
function waLink(n,text){let d=String(n||'').replace(/\D/g,'');if(!d)return '';if(d.startsWith('0'))d='62'+d.slice(1);else if(d.startsWith('8'))d='62'+d;return 'https://wa.me/'+d+(text?'?text='+encodeURIComponent(text):'')}
function igLink(h){h=String(h||'').trim();if(!h)return '';const m=h.match(/instagram\.com\/([^/?#]+)/i);h=(m?m[1]:h).replace(/^@/,'');return h?'https://instagram.com/'+encodeURIComponent(h):''}
function igHandle(h){const u=igLink(h);return u?'@'+decodeURIComponent(u.split('/').pop()):''}
function safeUrl(u){u=String(u||'').trim();if(!u)return '';if(!/^https?:\/\//i.test(u))u='https://'+u;try{const x=new URL(u);return /^https?:$/.test(x.protocol)?x.href:''}catch(e){return ''}}

function errText(e){
  const raw=(e&&(e.message||e.error_description))||'',m=raw.toLowerCase();
  for(const k in RPC_ERR)if(raw.includes(k))return RPC_ERR[k];
  if(m.includes('invalid login'))return 'Email atau password salah.';
  if(m.includes('email not confirmed'))return 'Email belum dikonfirmasi. Buka email dari Supabase lalu klik tautan konfirmasinya.';
  if(m.includes('already registered')||m.includes('already been registered'))return 'Email ini sudah terdaftar. Silakan masuk.';
  if(m.includes('password should')||m.includes('weak password'))return 'Password terlalu lemah. Pakai minimal 8 karakter campuran huruf dan angka.';
  if(m.includes('same password')||m.includes('different from the old'))return 'Password baru harus berbeda dari yang lama.';
  if(m.includes('rate limit')||m.includes('too many')||(e&&e.status===429))return 'Terlalu banyak percobaan. Tunggu beberapa menit lalu coba lagi.';
  if(m.includes('invalid email')||m.includes('unable to validate email')||m.includes('email address')&&m.includes('invalid'))return 'Format email tidak valid.';
  if(m.includes('row-level security')||m.includes('permission denied'))return 'Akses ditolak. Muat ulang halaman lalu coba lagi.';
  if(m.includes('could not find the function')||(e&&e.code==='PGRST202'))return 'Fitur ini belum aktif di server.';
  if(m.includes('failed to fetch')||m.includes('network')||m.includes('load failed'))return 'Tidak bisa terhubung ke server. Cek koneksi internet.';
  return raw?'Gagal: '+raw:'Gagal. Coba lagi sebentar.';
}
function chk(r){if(r.error)throw r.error;return r.data}

function rowToItem(r){return {...(r.data||{}),id:r.id,by:r.created_by,dibuat:Date.parse(r.created_at)||0}}
function upsertLocal(r){
  if(!r||r.wedding_id!==S.weddingId)return;const k=KIND_KEY[r.kind];if(!k)return;
  const it=rowToItem(r),i=S[k].findIndex(x=>x.id===r.id);
  if(i>=0)S[k][i]=it;else S[k].push(it);schedule();
}
function removeLocal(id){for(const k of Object.values(KIND_KEY)){const i=S[k].findIndex(x=>x.id===id);if(i>=0){S[k].splice(i,1);schedule()}}}
function applyWedding(data){S.plan=data||{};S.berkas=S.plan.berkas||null;schedule()}

const api={
  async patchWedding(patch){applyWedding(chk(await sb.rpc('patch_wedding',{p_wedding:S.weddingId,p_patch:patch})))},
  async set(p,d){return api.update(p,d)},
  async update(p,d){
    const [col,id]=p.split('/');
    if(col==='plan')return api.patchWedding(d);
    if(col==='berkas')return api.patchWedding({berkas:d});
    upsertLocal(chk(await sb.rpc('patch_item',{p_id:id,p_patch:d})));
  },
  async add(kind,d){const r=chk(await sb.from('items').insert({wedding_id:S.weddingId,kind,data:d}).select().single());upsertLocal(r);return r},
  async addMany(kind,arr){if(!arr.length)return;const rows=chk(await sb.from('items').insert(arr.map(d=>({wedding_id:S.weddingId,kind,data:d}))).select());rows.forEach(upsertLocal)},
  async del(p){const id=p.split('/')[1];chk(await sb.from('items').delete().eq('id',id));removeLocal(id)}
};

async function fetchItems(){
  const out=[];const N=1000;
  for(let from=0;;from+=N){
    const rows=chk(await sb.from('items').select('*').eq('wedding_id',S.weddingId).order('created_at',{ascending:true}).range(from,from+N-1));
    out.push(...rows);if(rows.length<N)break;
  }
  for(const k of Object.values(KIND_KEY))S[k]=[];
  for(const r of out){const k=KIND_KEY[r.kind];if(k)S[k].push(rowToItem(r))}
}
async function fetchMembers(){S.members=chk(await sb.from('wedding_members').select('*').eq('wedding_id',S.weddingId))}
async function fetchInvite(){
  const rows=chk(await sb.from('invites').select('*').eq('wedding_id',S.weddingId).is('used_by',null).gt('expires_at',new Date().toISOString()).order('created_at',{ascending:false}).limit(1));
  S.invite=rows[0]||null;
}
async function fetchWedding(){applyWedding(chk(await sb.from('weddings').select('data').eq('id',S.weddingId).single()).data)}

async function loadMembership(){
  const mem=chk(await sb.from('wedding_members').select('*').eq('user_id',S.userId).maybeSingle());
  if(!mem){teardown();S.view='join';render();return false}
  const changed=S.weddingId!==mem.wedding_id;
  S.weddingId=mem.wedding_id;S.myRole=mem.role;S.mePihak=mem.pihak;
  await Promise.all([fetchWedding(),fetchMembers(),fetchItems(),fetchInvite()]);
  if(store.get('pendingInvite')){store.set('pendingInvite',null);toast('Akunmu sudah terhubung ke planner, jadi kode undangan tidak dipakai.')}
  if(changed||!S.channel)subscribe();
  S.view='app';render();return true;
}
let lastRefresh=0;
async function refreshAll(force){
  if(!S.userId||S.view!=='app')return;
  if(!force&&Date.now()-lastRefresh<15000)return;lastRefresh=Date.now();
  try{const was=S.weddingId;const ok=await loadMembership();if(!ok&&was)toast('Kamu sudah tidak terhubung dengan planner tadi.')}catch(e){console.warn(e)}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refreshAll()});

function subscribe(){
  teardown();if(!S.weddingId)return;
  const W=S.weddingId;
  S.channel=sb.channel('planner-'+W)
    .on('postgres_changes',{event:'*',schema:'public',table:'items',filter:'wedding_id=eq.'+W},p=>{if(p.eventType==='DELETE')removeLocal(p.old&&p.old.id);else upsertLocal(p.new)})
    .on('postgres_changes',{event:'DELETE',schema:'public',table:'items'},p=>removeLocal(p.old&&p.old.id))
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'weddings',filter:'id=eq.'+W},p=>{if(p.new&&p.new.data)applyWedding(p.new.data)})
    .on('postgres_changes',{event:'*',schema:'public',table:'wedding_members'},()=>onMembersChanged())
    .subscribe();
}
function teardown(){if(S.channel){try{sb.removeChannel(S.channel)}catch(e){}S.channel=null}}
async function onMembersChanged(){
  const had=S.members.some(m=>m.role==='partner');
  try{
    const mem=chk(await sb.from('wedding_members').select('*').eq('user_id',S.userId).maybeSingle());
    if(!mem||mem.wedding_id!==S.weddingId){refreshAll(true);return}
    await Promise.all([fetchMembers(),fetchInvite()]);
    const has=S.members.some(m=>m.role==='partner');
    if(!had&&has&&S.myRole==='owner'){toast('Pasanganmu sudah terhubung');if(!$('#sheet').hidden&&$('#sheetTitle').textContent==='Pasangan')sheetPartner()}
    schedule();
  }catch(e){console.warn(e)}
}

async function handleSession(session){
  S.session=session;
  if(!session){teardown();Object.assign(S,{userId:null,email:'',weddingId:null,myRole:null,mePihak:null,members:[],invite:null,plan:null,berkas:null});for(const k of Object.values(KIND_KEY))S[k]=[];if(S.view!=='auth'&&S.view!=='boot')S.authTab='masuk';S.view='auth';render();return}
  if(S.recovery){S.userId=session.user.id;S.email=session.user.email||'';S.view='recovery';render();return}
  if(S.userId===session.user.id&&S.view!=='auth'&&S.view!=='boot')return;
  S.userId=session.user.id;S.email=session.user.email||'';
  S.view='boot';render();
  try{await loadMembership()}catch(e){console.warn(e);S.view='error';S.authMsg=errText(e);render()}
}

const kantongSorted=()=>[...S.kantong].sort((a,b)=>(a.urut??99)-(b.urut??99)||String(a.nama).localeCompare(b.nama));
function money(){
  const k={};S.kantong.forEach(x=>k[x.id]={...x,masuk:0,keluar:0});
  let masuk=0,keluar=0,uM=0,uK=0;const per={A:0,B:0,C:0};
  for(const t of S.trx){const j=+t.jumlah||0;
    if(t.tipe==='masuk'){masuk+=j;per[t.pihak in per?t.pihak:'C']+=j;k[t.kantong]?k[t.kantong].masuk+=j:uM+=j}
    else if(t.tipe==='keluar'){keluar+=j;k[t.kantong]?k[t.kantong].keluar+=j:uK+=j}
    else if(t.tipe==='pindah'){k[t.dari]?k[t.dari].masuk-=j:uM-=j;k[t.kantong]?k[t.kantong].masuk+=j:uM+=j}
  }
  const estimasi=S.kantong.reduce((a,x)=>a+(+x.estimasi||0),0);
  return{k,masuk,keluar,saldo:masuk-keluar,umum:uM-uK,per,estimasi};
}
const vendorPaid=id=>S.trx.filter(t=>t.tipe==='keluar'&&t.vendor===id).reduce((a,t)=>a+(+t.jumlah||0),0);
const namaPihak=p=>p==='A'?(S.plan?.namaA||'Calon pria'):p==='B'?(S.plan?.namaB||'Calon wanita'):p==='AB'?'Berdua':'Keluarga / bersama';

function pihakOf(x){const m=S.members.find(m=>m.user_id===x.by);return m?m.pihak:(x.byPihak||'')}
function berkasGroups(){
  const p=S.plan||{},kd=p.kondisi||{},out=[];
  for(const s of ['A','B']){
    const items=BERKAS_CATIN.filter(i=>!i.only||i.only===s).map(i=>({...i,key:s+'_'+i.id}))
      .concat(KONDISI.filter(c=>kd[s]?.[c.f]).map(c=>({id:c.f,t:c.t,k:c.k,key:s+'_'+c.f})));
    out.push({key:s,title:'Calon '+(s==='A'?'pengantin pria':'pengantin wanita'),who:namaPihak(s),items});
  }
  out.push({key:'W',title:'Wali & saksi',items:BERKAS_WALI.map(i=>({...i,key:'W_'+i.id}))});
  out.push({key:'D',title:'Pendaftaran di KUA',items:BERKAS_DAFTAR.filter(i=>!i.when||i.when(p)).map(i=>({...i,key:'D_'+i.id}))});
  const cus=Object.entries(S.berkas?.custom||{}).filter(([,v])=>v&&v.t).map(([id,v])=>({id,t:v.t,k:v.k,key:'X_'+id,custom:true}));
  if(cus.length)out.push({key:'X',title:'Tambahan dari KUA kalian',items:cus});
  out.push({key:'S',title:'Setelah akad',items:BERKAS_SETELAH.map(i=>({...i,key:'S_'+i.id}))});
  return out;
}

async function onAuthSubmit(e){
  e.preventDefault();const t=S.authTab,email=$('#a_email').value.trim().toLowerCase(),btn=$('#a_go');
  const fail=text=>{S.authMsg={text};render()};
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return fail('Format email tidak valid.');
  store.set('lastEmail',email);
  btn.disabled=true;btn.textContent='Sebentar…';
  try{
    if(t==='lupa'){
      chk(await sb.auth.resetPasswordForEmail(email,{redirectTo:BASE_URL+'?reset=1'}));
      S.authTab='masuk';S.authMsg={ok:true,text:'Kalau email itu terdaftar, tautan untuk membuat password baru sudah dikirim. Cek juga folder spam.'};render();return;
    }
    const pw=$('#a_pw').value;
    if(pw.length<8)return fail('Password minimal 8 karakter.');
    if(t==='daftar'){
      if(pw!==$('#a_pw2').value)return fail('Kedua password tidak sama.');
      const inv=store.get('pendingInvite');
      const d=chk(await sb.auth.signUp({email,password:pw,options:{emailRedirectTo:BASE_URL+(inv?'?invite='+encodeURIComponent(inv):'')}}));
      if(d.user&&Array.isArray(d.user.identities)&&d.user.identities.length===0){S.authTab='masuk';return fail('Email ini sudah terdaftar. Silakan masuk.')}
      if(!d.session){S.authTab='masuk';S.authMsg={ok:true,text:'Akun dibuat. Buka email dari Supabase lalu klik tautan konfirmasi, setelah itu masuk di sini.'};render()}
      else S.authMsg=null;
    }else{
      chk(await sb.auth.signInWithPassword({email,password:pw}));S.authMsg=null;
    }
  }catch(err){console.warn(err);fail(errText(err))}
  finally{if(btn.isConnected){btn.disabled=false;btn.textContent=t==='daftar'?'Buat akun':t==='lupa'?'Kirim tautan':'Masuk'}}
}

function kpi(l,v,pc,tab){return `<div class="kpi" role="button" tabindex="0" data-tab="${tab}" style="cursor:pointer"><span>${l}</span><span class="v num">${v}</span><div class="bar"><span style="width:${pc.toFixed(1)}%"></span></div></div>`}
function nabungCard(m){
  const p=S.plan,tot=m.per.A+m.per.B+m.per.C,d=daysUntil(p.tanggal),sisa=Math.max(0,m.estimasi-m.masuk);
  const bln=d&&d>0?Math.max(1,Math.ceil(d/30.44)):null;
  let target='';
  if(m.estimasi<=0)target=`<p class="small muted" style="margin:12px 0 0">Isi estimasi di tiap kantong (menu Keuangan) supaya target nabung per bulan bisa dihitung.</p>`;
  else if(sisa<=0)target=`<p class="small" style="margin:12px 0 0;color:var(--ok)">Dana sudah memenuhi total estimasi.</p>`;
  else if(bln)target=`<div class="cols3" style="margin-top:14px"><div><div class="lbl">Kurang</div><div class="val num">${rp(sisa)}</div></div><div><div class="lbl">Per bulan berdua</div><div class="val num">${rp(sisa/bln)}</div></div><div><div class="lbl">Per orang / bulan</div><div class="val num">${rp(sisa/bln/2)}</div></div></div><p class="small muted" style="margin:8px 0 0">Dihitung dari sisa ${bln} bulan sampai hari akad.</p>`;
  else target=`<p class="small muted" style="margin:12px 0 0">Masih kurang ${rp(sisa)}. Atur tanggal akad untuk melihat target per bulan.</p>`;
  return `<div class="card"><div class="split" aria-hidden="true">${tot?['A','B','C'].map(k=>m.per[k]?`<span style="width:${pct(m.per[k],tot)}%;background:var(--${k==='C'?'accent':'p'+k})"></span>`:'').join(''):''}</div>
  <div class="row wrap" style="gap:16px;margin-top:10px">${['A','B','C'].map(k=>`<div class="row small" style="gap:6px"><span class="dot" style="background:var(--${k==='C'?'accent':'p'+k})"></span>${esc(namaPihak(k))} <b class="num">${rp(m.per[k])}</b></div>`).join('')}</div>${target}</div>`;
}
function trxText(t){
  const k=S.kantong.find(x=>x.id===t.kantong);const kn=k?k.nama:'Belum dialokasikan';
  if(t.tipe==='masuk')return `menyetor <b class="num">${rp(t.jumlah)}</b> ke ${esc(kn)}`;
  if(t.tipe==='pindah'){const f=S.kantong.find(x=>x.id===t.dari);return `memindahkan <b class="num">${rp(t.jumlah)}</b> dari ${esc(f?f.nama:'Belum dialokasikan')} ke ${esc(kn)}`}
  const v=S.vendors.find(x=>x.id===t.vendor);return `mencatat pengeluaran <b class="num">${rp(t.jumlah)}</b>${v?' untuk '+esc(v.nama):''} · ${esc(kn)}`;
}

/* ---------- Sheet & form ---------- */
let lastFocus=null;
function openSheet(title,body,mount){lastFocus=document.activeElement;$('#sheetTitle').textContent=title;$('#sheetBody').innerHTML=body;$('#scrim').hidden=false;$('#sheet').hidden=false;$('#sheet').scrollTop=0;mount&&mount($('#sheetBody'));const f=$('#sheetBody input:not([type=radio]):not([type=checkbox]),#sheetBody select');if(f&&window.innerWidth>760)f.focus()}
function closeSheet(){$('#scrim').hidden=true;$('#sheet').hidden=true;$('#sheetBody').innerHTML='';lastFocus&&lastFocus.isConnected&&lastFocus.focus&&lastFocus.focus()}
$('#scrim').onclick=closeSheet;$('#sheetClose').onclick=closeSheet;
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});
/* Kolom uang: titik ribuan muncul langsung saat mengetik (1.300.000). Singkatan 1,3jt / 500rb tetap dibaca saat kolom ditinggalkan. */
function moneyInputs(root){root.querySelectorAll('[data-money]').forEach(i=>{
  if(!i.parentNode.classList.contains('moneywrap')){const w=document.createElement('span');w.className='moneywrap';i.parentNode.insertBefore(w,i);w.appendChild(i);w.insertAdjacentHTML('afterbegin','<span aria-hidden="true">Rp</span>')}
  const fmt=(v,pos)=>{
    const digitsBefore=v.slice(0,pos).replace(/\D/g,'').replace(/^0+(?=\d)/,'').length;
    const d=v.replace(/\D/g,'').replace(/^0+(?=\d)/,'').slice(0,13),out=d?Number(d).toLocaleString('id-ID'):'';
    i.value=out;let p=0,seen=0;while(p<out.length&&seen<digitsBefore){if(/\d/.test(out[p]))seen++;p++}
    try{i.setSelectionRange(p,p)}catch(e){}
  };
  i.addEventListener('input',()=>{const v=i.value;if(!/^[\d.\s]*$/.test(v))return;const pos=i.selectionStart??v.length;fmt(v,pos)});
  // Hapus melewati titik: Backspace tepat setelah titik menghapus angka di depannya
  i.addEventListener('beforeinput',e=>{
    const v=i.value,s=i.selectionStart,t=i.selectionEnd;if(s!==t||!/^[\d.]*$/.test(v))return;
    if(e.inputType==='deleteContentBackward'&&s>1&&v[s-1]==='.'){e.preventDefault();fmt(v.slice(0,s-2)+v.slice(s),s-2)}
    else if(e.inputType==='deleteContentForward'&&v[s]==='.'){e.preventDefault();fmt(v.slice(0,s)+v.slice(s+2),s)}
  });
  i.addEventListener('blur',()=>{const n=parseRp(i.value);i.value=fmtInput(n)});
})}
function confirmDel(btn,fn,label){btn.onclick=async()=>{if(btn.dataset.armed){btn.disabled=true;if(await fn())closeSheet();else btn.disabled=false}else{btn.dataset.armed='1';btn.textContent=label||'Tap lagi untuk menghapus'}}}

const kantongOpts=(sel,none='Belum dialokasikan')=>opt('',none,sel||'')+kantongSorted().map(k=>opt(k.id,k.nama,sel)).join('');

/* Riwayat pemasukan / pengeluaran: periode, total, donat per kategori, daftar transaksi */
const RIW_PER=[['semua','Semua'],['bulan','Bulan ini'],['lalu','Bulan lalu'],['30','30 hari'],['pilih','Pilih tanggal']];
function riwRange(){
  const r=S.riw,t=todayISO(),ym=t.slice(0,7);
  if(r.per==='bulan')return[ym+'-01',t];
  if(r.per==='lalu'){const n=new Date(t+'T00:00:00'),y=n.getMonth()===0?n.getFullYear()-1:n.getFullYear(),m=(n.getMonth()+11)%12,last=new Date(y,m+1,0).getDate(),mo=String(m+1).padStart(2,'0');return[`${y}-${mo}-01`,`${y}-${mo}-${String(last).padStart(2,'0')}`]}
  if(r.per==='30'){const d=new Date(t+'T00:00:00');d.setDate(d.getDate()-29);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return[d.toISOString().slice(0,10),t]}
  if(r.per==='pilih')return[r.from||'0000-00-00',r.to||'9999-12-31'];
  return['0000-00-00','9999-12-31'];
}
function riwLabel(){const r=S.riw,[a,b]=riwRange();if(r.per==='semua')return 'Semua waktu';if(r.per==='pilih'&&!r.from&&!r.to)return 'Semua tanggal';const f=x=>x.startsWith('0000')||x.startsWith('9999')?'…':fmtDate(x);return `${f(a)} – ${f(b)}`}
function riwGroups(){
  const r=S.riw,[a,b]=riwRange();
  const tx=S.trx.filter(t=>t.tipe===r.tipe&&String(t.tanggal||'')>=a&&String(t.tanggal||'')<=b);
  const g={};
  for(const t of tx){
    let key,name;
    if(r.tipe==='masuk'){key=t.pihak in {A:1,B:1}?t.pihak:'C';name=namaPihak(key)}
    else{const k=S.kantong.find(x=>x.id===t.kantong);key=k?k.id:'';name=k?k.nama:'Belum dialokasikan'}
    (g[key]=g[key]||{key,name,total:0,tx:[]}).total+=+t.jumlah||0;g[key].tx.push(t);
  }
  const arr=Object.values(g).sort((x,y)=>y.total-x.total);
  arr.forEach((x,i)=>{x.color=`var(--g${i%9+1})`;x.tx.sort((p,q)=>String(q.tanggal).localeCompare(String(p.tanggal))||(q.dibuat||0)-(p.dibuat||0))});
  return{arr,total:arr.reduce((s,x)=>s+x.total,0),count:tx.length};
}
function donutSvg(arr,total,count){
  const R=78,C=2*Math.PI*R,gap=arr.length>1?2.5:0;let off=0;
  const segs=total>0?arr.map(x=>{const len=Math.max(0,x.total/total*C-gap);const s=`<circle r="${R}" cx="110" cy="110" fill="none" stroke="${x.color}" stroke-width="30" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 110 110)"/>`;off+=x.total/total*C;return s}).join(''):'';
  return `<svg class="donut" viewBox="0 0 220 220" role="img" aria-label="Diagram pembagian per kategori"><circle r="${R}" cx="110" cy="110" fill="none" stroke="var(--surface-2)" stroke-width="30"/>${segs}<text x="110" y="106" text-anchor="middle" font-size="26" font-weight="700">${count}</text><text x="110" y="128" text-anchor="middle" font-size="12" style="fill:var(--muted)">transaksi</text></svg>`;
}
function riwDraw(){
  const box=$('#riwBody');if(!box)return;
  const r=S.riw,{arr,total,count}=riwGroups(),masuk=r.tipe==='masuk';
  const pctTxt=x=>(total?x/total*100:0).toLocaleString('id-ID',{minimumFractionDigits:1,maximumFractionDigits:1})+'%';
  const txRow=t=>{const v=S.vendors.find(x=>x.id===t.vendor);const judul=t.catatan||(v?v.nama:(masuk?'Setoran':'Pengeluaran'));
    return `<div class="riw-tx row between" role="button" tabindex="0" data-act="riwTx" data-id="${esc(t.id)}"><span class="grow"><span style="display:block;overflow-wrap:anywhere">${esc(judul)}</span><span class="sub">${esc(fmtDate(t.tanggal))}${!masuk&&v&&t.catatan?' · '+esc(v.nama):''} · ${esc(siapa(t))}</span></span><span class="amt num ${masuk?'in':'out'}">${masuk?'+':'−'}${rp(t.jumlah)}</span></div>`};
  box.innerHTML=`<div class="seg" style="margin-top:12px">${[['masuk','Pemasukan'],['keluar','Pengeluaran']].map(([k,l])=>`<label><input type="radio" name="riw_t" data-act="riwTipe" value="${k}" ${r.tipe===k?'checked':''}>${l}</label>`).join('')}</div>
    <div class="chips" style="margin-top:12px">${RIW_PER.map(([k,l])=>`<button class="chip" data-act="riwPer" data-v="${k}" aria-pressed="${r.per===k}">${l}</button>`).join('')}</div>
    ${r.per==='pilih'?`<div class="datebox"><label class="fld"><span>Dari</span><input type="date" id="riw_from" data-act="riwDate" value="${esc(r.from)}"></label><label class="fld"><span>Sampai</span><input type="date" id="riw_to" data-act="riwDate" value="${esc(r.to)}"></label></div>`:''}
    <div style="margin-top:16px"><div class="lbl">${masuk?'Pemasukan':'Pengeluaran'} · ${esc(riwLabel())}</div><div class="big num">${rp(total)}</div></div>
    ${count?donutSvg(arr,total,count)+`<div class="list" style="margin-top:8px">${arr.map(x=>`<div class="riw-row" role="button" tabindex="0" data-act="riwOpen" data-k="${esc(x.key)}" aria-expanded="${r.open===x.key}"><span class="riw-sw" style="background:${x.color}">${esc((x.name||'?').charAt(0).toUpperCase())}</span><span class="grow"><b style="display:block;overflow-wrap:anywhere">${esc(x.name)}</b><span class="num" style="font-weight:600">${rp(x.total)}</span> <span class="sub">· ${x.tx.length} transaksi</span></span><span class="num sub" style="font-weight:600">${pctTxt(x.total)}</span></div>${r.open===x.key?x.tx.map(txRow).join(''):''}`).join('')}</div>
      <p class="sub" style="margin:10px 2px 0">${masuk?'Dikelompokkan per orang yang menyetor.':'Dikelompokkan per kantong.'} Ketuk kategori untuk melihat transaksinya. Pindah dana antar kantong tidak dihitung.</p>`
      :`<div class="empty">Belum ada ${masuk?'pemasukan':'pengeluaran'} di periode ini.</div>`}`;
}
function sheetRiwayat(tipe){
  S.riw={tipe,per:(S.riw&&S.riw.per)||'semua',from:(S.riw&&S.riw.from)||'',to:(S.riw&&S.riw.to)||'',open:null};
  openSheet('Riwayat','<div id="riwBody"></div>',()=>riwDraw());
}

/* Kategori yang bisa dikelola: kategori vendor, tahap tugas, grup tamu */
const CAT={
  vendor:{judul:'Kategori vendor',kata:'kategori',satuan:'vendor',key:'kategoriVendor',std:KATEGORI,kind:'vendors',field:'kategori',items:()=>S.vendors,fallback:'Lainnya',min:1},
  fase:{judul:'Tahap tugas',kata:'tahap',satuan:'tugas',key:'faseTugas',std:FASE,kind:'tugas',field:'fase',items:()=>S.tugas,fallback:'Lainnya',min:1},
  grup:{judul:'Grup tamu',kata:'grup',satuan:'tamu',key:'grupTamu',std:GRUP_STD,kind:'tamu',field:'grup',items:()=>S.tamu,fallback:'',min:0}
};
const catOf=(c,x)=>String(x[CAT[c].field]||'').trim()||CAT[c].fallback;
function catList(c){
  const d=CAT[c],base=Array.isArray(S.plan?.[d.key])?S.plan[d.key]:d.std;
  return [...base,...new Set(d.items().map(x=>catOf(c,x)).filter(v=>v&&!base.includes(v)))];
}
const catManageBtn=(c,label)=>`<div class="row" style="justify-content:flex-end;margin-top:10px"><button class="linkbtn" data-act="cats" data-c="${c}">${ico('edit')} ${label}</button></div>`;
const sameName=(a,b)=>a.trim().toLowerCase()===b.trim().toLowerCase();
async function catMove(c,from,to,onStep){
  const d=CAT[c],xs=d.items().filter(x=>catOf(c,x)===from);
  for(let i=0;i<xs.length;i+=8){
    await Promise.all(xs.slice(i,i+8).map(x=>api.update(d.kind+'/'+x.id,{[d.field]:to})));
    onStep&&onStep(Math.min(i+8,xs.length),xs.length);
  }
  return xs.length;
}
function sheetCats(c,ui={}){
  const d=CAT[c],list=catList(c),count=n=>d.items().filter(x=>catOf(c,x)===n).length;
  const rows=list.map((n,i)=>{
    const k=count(n);
    if(ui.edit===n)return `<form class="f cat-row" data-i="${i}" id="catRename" style="margin:0"><label class="fld"><span>Nama baru</span><input id="cat_new" required maxlength="40" value="${esc(n)}" autocomplete="off"></label><div class="btnrow"><button class="btn primary sm" type="submit">Simpan</button><button class="btn sm ghost" type="button" data-act="catsView" data-c="${c}">Batal</button></div></form>`;
    if(ui.del===n){
      const others=list.filter(x=>x!==n),def=c==='grup'?'':(others.includes(d.fallback)?d.fallback:others[0]);
      const pick=k?`<label class="fld" style="margin-top:8px"><span>Pindahkan ${k} ${d.satuan} di dalamnya ke</span><select id="cat_to">${c==='grup'?opt('','Tanpa grup',def):''}${others.map(o=>opt(o,o,def)).join('')}</select></label>`:'';
      return `<div><b>Hapus ${esc(d.kata)} "${esc(n)}"?</b>${k?'':`<div class="sub">Tidak ada ${d.satuan} di dalamnya.</div>`}${pick}<div class="btnrow" style="margin-top:10px"><button class="btn danger sm" id="cat_del_go" data-i="${i}">Ya, hapus</button><button class="btn sm ghost" type="button" data-act="catsView" data-c="${c}">Batal</button></div></div>`;
    }
    return `<div class="row between"><span class="grow"><b>${esc(n)}</b> <span class="sub">· ${k} ${d.satuan}</span></span><span class="btnrow" style="flex-wrap:nowrap"><button class="btn sm" data-act="catEdit" data-c="${c}" data-i="${i}">Ganti nama</button><button class="btn sm danger" data-act="catDel" data-c="${c}" data-i="${i}" ${list.length<=d.min?'disabled':''}>Hapus</button></span></div>`;
  }).join('');
  openSheet(d.judul,`<p class="sub" style="margin:10px 0 12px">Ganti nama atau hapus ${d.kata}. ${d.satuan[0].toUpperCase()+d.satuan.slice(1)} di dalamnya tidak ikut terhapus.</p>
    <div class="list">${rows||`<div class="empty small">Belum ada ${d.kata}.</div>`}</div>
    <form class="f" id="catAdd"><label class="fld"><span>Tambah ${d.kata} baru</span><input id="cat_add" required maxlength="40" autocomplete="off" placeholder="Nama ${d.kata}"></label><button class="btn sm" type="submit" style="align-self:flex-start">${ico('plus',2)}Tambah</button></form>
    <p class="sub" id="cat_prog" hidden></p>`,
  root=>{
    const prog=t=>{const p=$('#cat_prog');if(p){p.hidden=false;p.textContent=t}};
    const busy=b=>root.querySelectorAll('button,input,select').forEach(el=>el.disabled=b);
    const taken=(name,except)=>list.some(x=>x!==except&&sameName(x,name));
    const rf=$('#catRename');
    if(rf){const inp=$('#cat_new');inp.focus();inp.select();
      rf.onsubmit=async e=>{e.preventDefault();const old=list[+rf.dataset.i],nw=inp.value.trim();
        if(!nw||nw===old)return sheetCats(c);
        if(taken(nw,old))return toast(`Nama "${nw}" sudah dipakai ${d.kata} lain.`);
        busy(true);
        const ok=await save(async()=>{
          await api.patchWedding({[d.key]:list.map(x=>x===old?nw:x)});
          await catMove(c,old,nw,(a,b)=>prog(`Memperbarui ${a}/${b} ${d.satuan}…`));
        },`${d.kata[0].toUpperCase()+d.kata.slice(1)} diganti jadi "${nw}"`);
        ok?sheetCats(c):busy(false)}}
    const dg=$('#cat_del_go');
    if(dg)dg.onclick=async()=>{const name=list[+dg.dataset.i],sel=$('#cat_to'),to=sel?sel.value:'';
      busy(true);
      const ok=await save(async()=>{
        await catMove(c,name,to,(a,b)=>prog(`Memindahkan ${a}/${b} ${d.satuan}…`));
        await api.patchWedding({[d.key]:catList(c).filter(x=>x!==name)});
      },`${d.kata[0].toUpperCase()+d.kata.slice(1)} "${name}" dihapus`);
      ok?sheetCats(c):busy(false)};
    $('#catAdd').onsubmit=async e=>{e.preventDefault();const nw=$('#cat_add').value.trim();if(!nw)return;
      if(taken(nw))return toast(`Nama "${nw}" sudah ada.`);
      busy(true);
      if(await save(()=>api.patchWedding({[d.key]:[...list,nw]}),`${d.kata[0].toUpperCase()+d.kata.slice(1)} "${nw}" ditambahkan`))sheetCats(c);else busy(false)};
  });
}

  <h4>5. Berkas</h4><ol><li>Pilih kondisi kalian (usia, status, TNI/Polri, lokasi akad). Berkas tambahan muncul otomatis.</li><li>Centang berkas yang sudah siap. Pasangan bisa melihat siapa yang mencentang.</li></ol>
  <h4>6. Persiapan</h4><ol><li><b>Tugas</b>: daftar per tahap. Ketuk label nama untuk ganti penanggung jawab.</li><li><b>Seserahan & mahar</b>: isi item dan perkiraan harga, centang yang sudah dibeli.</li></ol>
  <p class="muted" style="margin-top:14px">Semua perubahan tersimpan otomatis dan langsung terlihat oleh kalian berdua. Ganti password atau keluar dari akun lewat ikon gerigi.</p></div>`);
}

/* ---------- Interaksi ---------- */
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-tab],[data-act]');if(!el)return;
  if(el.dataset.tab&&!el.dataset.act){S.tab=el.dataset.tab;store.set('tab',S.tab);history.replaceState(null,'','#'+S.tab);render();window.scrollTo(0,0);return}
  const a=el.dataset.act,id=el.dataset.id;
  if(a==='authTab'){S.authTab=el.dataset.v;S.authMsg=null;render()}
  else if(a==='pwToggle'){const i=document.getElementById(el.dataset.for);if(i){i.type=i.type==='password'?'text':'password';el.textContent=i.type==='password'?'Lihat':'Tutup'}}
  else if(a==='logout'){closeSheet();await sb.auth.signOut();toast('Kamu sudah keluar')}
  else if(a==='reload')location.reload();
  else if(a==='settings')sheetSettings();
  else if(a==='partner')sheetPartner();
  else if(a==='changePw')sheetChangePw();
  else if(a==='copyInvite'){if(S.invite)copyText(inviteLink(S.invite.code))}
  else if(a==='vendor')sheetVendor(id);
  else if(a==='trx')sheetTrx(id,{tipe:el.dataset.tipe,vendor:el.dataset.vendor});
  else if(a==='kantong')sheetKantong(id);
  else if(a==='taskEdit')sheetTask(id);
  else if(a==='addBerkas')sheetAddBerkas();
  else if(a==='help')sheetHelp();
  else if(a==='riwayat')sheetRiwayat(el.dataset.t);
  else if(a==='riwPer'){S.riw.per=el.dataset.v;S.riw.open=null;riwDraw()}
  else if(a==='riwOpen'){S.riw.open=S.riw.open===el.dataset.k?null:el.dataset.k;riwDraw()}
  else if(a==='riwTx'){const back=()=>{const keep={...S.riw};openSheet('Riwayat','<div id="riwBody"></div>',()=>{S.riw=keep;riwDraw()})};sheetTrx(id,{back})}
  else if(a==='cats'||a==='catsView'){e.preventDefault();sheetCats(el.dataset.c)}
  else if(a==='catEdit'||a==='catDel'){const c=el.dataset.c,n=catList(c)[+el.dataset.i];if(n!=null)sheetCats(c,a==='catEdit'?{edit:n}:{del:n})}
  else if(a==='tamuAdd')sheetTamuBulk();
  else if(a==='tamu')sheetTamu(id);
  else if(a==='tplUndangan')sheetTpl();
  else if(a==='sesEdit')sheetSes(id);
  else if(a==='vf'){S.vendorFilter=el.dataset.v;render()}
  else if(a==='tf'){S.taskFilter=el.dataset.v;render()}
  else if(a==='tamuF'){S.tamuFilter=el.dataset.v;render()}
  else if(a==='rsvp'){const x=S.tamu.find(t=>t.id===id);if(x)save(()=>api.update('tamu/'+id,{rsvp:{belum:'hadir',hadir:'tidak',tidak:'belum'}[x.rsvp||'belum']}))}
  else if(a==='waUndang'){const x=S.tamu.find(t=>t.id===id);if(x&&!x.terkirim)save(()=>api.update('tamu/'+id,{terkirim:true}))}
  else if(a==='pj'){const t=S.tugas.find(x=>x.id===id);if(!t)return;const nx={A:'B',B:'AB',AB:'A'}[t.pj||'AB'];save(()=>api.update('tugas/'+id,{pj:nx}))}
  else if(a==='flag'){const s=el.dataset.s,f=el.dataset.f;const kd=S.plan.kondisi||{};const cur=s?!!kd[s]?.[f]:!!kd[f];save(()=>api.update('plan/main',{kondisi:s?{[s]:{[f]:!cur}}:{[f]:!cur}}))}
  else if(a==='lokasi'){save(()=>api.update('plan/main',{lokasi:S.plan.lokasi==='luar'?'kua':'luar'}))}
  else if(a==='delBerkas'){e.preventDefault();save(()=>api.update('berkas/state',{custom:{[id]:null}}),'Berkas dihapus')}
  else if(a==='sesEstimasi'){const est=S.seserahan.reduce((s,x)=>s+(+x.harga||0),0);save(()=>api.update('kantong/'+id,{estimasi:est}),'Estimasi kantong diperbarui')}
  else if(a==='kantongStd'){el.disabled=true;const u=S.kantong.length;save(()=>api.addMany('kantong',KANTONG_STD.map((n,i)=>({nama:n,estimasi:n==='KUA & Berkas'&&S.plan.lokasi==='luar'?600000:0,urut:u+i,...meta()}))))}
  else if(a==='tugasStd'){el.disabled=true;let u=0;const arr=[];for(const f of Object.keys(TUGAS_STD))for(const t of TUGAS_STD[f])arr.push({judul:t,fase:f,pj:'AB',selesai:false,urut:u++,...meta()});save(()=>api.addMany('tugas',arr))}
  else if(a==='sesStd'){el.disabled=true;let u=0;const arr=[];for(const j of ['mahar','seserahan'])for(const n of SES_STD[j])arr.push({nama:n,jenis:j,harga:0,pj:j==='mahar'?'A':'AB',dibeli:false,catatan:'',urut:u++,...meta()});save(()=>api.addMany('seserahan',arr))}
});
document.addEventListener('change',e=>{
  const el=e.target;if(!el.dataset||!el.dataset.act)return;
  if(el.dataset.act==='task')save(()=>api.update('tugas/'+el.dataset.id,{selesai:el.checked}));
  if(el.dataset.act==='ses')save(()=>api.update('seserahan/'+el.dataset.id,{dibeli:el.checked}));
  if(el.dataset.act==='prep'){S.prepView=el.value;store.set('prep',el.value);render()}
  if(el.dataset.act==='riwTipe'){S.riw.tipe=el.value;S.riw.open=null;riwDraw()}
  if(el.dataset.act==='riwDate'){S.riw[el.id==='riw_from'?'from':'to']=el.value;S.riw.open=null;riwDraw()}
  if(el.dataset.act==='berkas')save(()=>api.update('berkas/state',{items:{[el.dataset.k]:{done:el.checked,byPihak:S.mePihak||null,by:S.userId||null,at:Date.now()}}}));
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=button]')){e.preventDefault();e.target.click()}});
document.addEventListener('input',e=>{if(e.target.id==='tamuQ'){S.tamuQ=e.target.value;render()}});

let tt=0;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,3200)}

/* ---------- Mulai ---------- */
if(!sb){S.view='config';render()}
else{
  sb.auth.onAuthStateChange((ev,session)=>{
    if(ev==='PASSWORD_RECOVERY')S.recovery=true;
    if(ev==='TOKEN_REFRESHED'||ev==='USER_UPDATED'){S.session=session;return}
    setTimeout(()=>handleSession(session),0);
  });
}
</script>
</body>
</html>
